name: 不具合の報告 / Bug report
description: うまく入力されない、エラーが出るなど
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか
      description: 期待した動きと、実際の動きを書いてください
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. VM のコンソールで ... の画面を開く
        2. 「...」をクリックして 162 と入力
        3. ...
    validations:
      required: true
  - type: input
    id: ext-version
    attributes:
      label: 拡張機能のバージョン
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: pve
    attributes:
      label: Proxmox VE のバージョン
      placeholder: 8.x
  - type: input
    id: guest
    attributes:
      label: ゲストOSと画面
      placeholder: Ubuntu 24.04 インストーラーの IPv4 設定画面
  - type: dropdown
    id: layout
    attributes:
      label: 拡張機能のキーボード配列の設定
      options: [US, JIS]
  - type: input
    id: browser
    attributes:
      label: Chrome のバージョン
      placeholder: 140.x
  - type: textarea
    id: extra
    attributes:
      label: 補足（スクリーンショット、使ったプラグインのJSONなど）
      description: パスワードなどの機密情報は消してから貼ってください
